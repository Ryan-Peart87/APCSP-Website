<body style="background-color: white;">
<div id="gameContainer">
    <canvas id="gameCanvas" width="360" height="540"></canvas>
    <div id="uiScreen">
        <h1 id="uiTitle">FLAPPY BIRD</h1>
        <p id="uiPrompt">Press SPACE or Click to Start</p>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const uiScreen = document.getElementById("uiScreen");
const uiTitle = document.getElementById("uiTitle");
const uiPrompt = document.getElementById("uiPrompt");

// Game Settings & Variables
let gameState = "START"; // START, PLAYING, GAMEOVER
let score = 0;
let highScore = localStorage.getItem("flappyHighScore") || 0;
let animationFrameId;

// Bird Object
const bird = {
    x: 50,
    y: 200,
    width: 34,
    height: 24,
    gravity: 0.25,
    velocity: 0,
    jump: -5.5,
    
    draw() {
        ctx.fillStyle = "#F7D302"; // Yellow bird body
        ctx.fillRect(this.x, this.y, this.width, this.height);
        
        ctx.fillStyle = "#FFF"; // Eye
        ctx.fillRect(this.x + 22, this.y + 4, 6, 6);
        ctx.fillStyle = "#E65100"; // Beak
        ctx.fillRect(this.x + 28, this.y + 8, 8, 6);
    },
    
    update() {
        if (gameState === "PLAYING") {
            this.velocity += this.gravity;
            this.y += this.velocity;
        }
        
        // Ceiling boundary
        if (this.y < 0) {
            this.y = 0;
            this.velocity = 0;
        }
        
        // Floor boundary collision
        if (this.y + this.height >= canvas.height) {
            this.y = canvas.height - this.height;
            endGame();
        }
    },
    
    flap() {
        this.velocity = this.jump;
    },
    
    reset() {
        this.y = 200;
        this.velocity = 0;
    }
};

// Pipes Configuration
const pipes = {
    positionArray: [],
    width: 60,
    gap: 130,
    speed: 2,
    spawnInterval: 100,
    timer: 0,
    
    draw() {
        ctx.fillStyle = "#73BF2E"; // Green pipes
        for (let i = 0; i < this.positionArray.length; i++) {
            let p = this.positionArray[i];
            
            // Top Pipe
            ctx.fillRect(p.x, 0, this.width, p.topHeight);
            ctx.fillStyle = "#558A22"; // Shadow highlight
            ctx.fillRect(p.x, p.topHeight - 15, this.width, 15);
            ctx.fillStyle = "#73BF2E";

            // Bottom Pipe
            let bottomY = p.topHeight + this.gap;
            let bottomHeight = canvas.height - bottomY;
            ctx.fillRect(p.x, bottomY, this.width, bottomHeight);
            ctx.fillStyle = "#558A22";
            ctx.fillRect(p.x, bottomY, this.width, 15);
            ctx.fillStyle = "#73BF2E";
        }
    },
    
    update() {
        if (gameState !== "PLAYING") return;
        
        this.timer++;
        if (this.timer % this.spawnInterval === 0) {
            // Generate dynamic random heights for top pipe
            let minHeight = 40;
            let maxHeight = canvas.height - this.gap - 40;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
            
            this.positionArray.push({
                x: canvas.width,
                topHeight: topHeight,
                passed: false
            });
        }
        
        for (let i = 0; i < this.positionArray.length; i++) {
            let p = this.positionArray[i];
            p.x -= this.speed;
            
            // Collision Detection
            let bottomY = p.topHeight + this.gap;
            if (
                bird.x + bird.width > p.x && 
                bird.x < p.x + this.width && 
                (bird.y < p.topHeight || bird.y + bird.height > bottomY)
            ) {
                endGame();
            }
            
            // Score tracking
            if (!p.passed && bird.x > p.x + this.width) {
                score++;
                p.passed = true;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("flappyHighScore", highScore);
                }
            }
        }
        
        // Remove pipes off-screen
        if (this.positionArray.length > 0 && this.positionArray[0].x < -this.width) {
            this.positionArray.shift();
        }
    },
    
    reset() {
        this.positionArray = [];
        this.timer = 0;
    }
};

// Render Scoreboard
function drawScore() {
    ctx.fillStyle = "#FFF";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.font = "bold 35px sans-serif";
    
    if (gameState === "PLAYING") {
        ctx.fillText(score, canvas.width / 2 - 10, 50);
        ctx.strokeText(score, canvas.width / 2 - 10, 50);
    }
}

// Main Game Loop
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    pipes.update();
    pipes.draw();
    
    bird.update();
    bird.draw();
    
    drawScore();
    
    animationFrameId = requestAnimationFrame(gameLoop);
}

// Action Interactions
function handleAction() {
    if (gameState === "START") {
        gameState = "PLAYING";
        uiScreen.classList.add("hide");
    } else if (gameState === "PLAYING") {
        bird.flap();
    } else if (gameState === "GAMEOVER") {
        resetGame();
        gameState = "PLAYING";
        uiScreen.classList.add("hide");
    }
}

function endGame() {
    gameState = "GAMEOVER";
    uiTitle.innerText = "GAME OVER";
    uiPrompt.innerHTML = `Score: ${score} <br> Best: ${highScore} <br><br> Press SPACE / Click to Restart`;
    uiScreen.classList.remove("hide");
}

function resetGame() {
    score = 0;
    bird.reset();
    pipes.reset();
}

// Event Listeners
window.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.key === " ") {
        e.preventDefault(); // Prevents page scrolling down
        handleAction();
    }
});

canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    handleAction();
}, { passive: false });

canvas.addEventListener("mousedown", () => {
    handleAction();
});

// Start initialization
gameLoop();
</script>
